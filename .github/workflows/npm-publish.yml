name: Node.js Package

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      package_version:
        description: 'Package version to publish, e.g. 0.1.1'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test test/package-version.test.ts
      - name: generate
        env:
          API_KEY: ${{ secrets.API_KEY }}
          PACKAGE_VERSION: ${{ github.event.release.tag_name || inputs.package_version }}
        run: bun dev gen https://api.staging.rewards.wlloyalty.net/v1/openapi.json -k "$API_KEY" --package-version "$PACKAGE_VERSION"
      - uses: actions/setup-node@v4
        with:
          node-version: latest
          registry-url: 'https://registry.npmjs.org'
      - run: npm publish --access public ./wll-rewards-sdk.tgz
        working-directory: ./sdk/typescript
